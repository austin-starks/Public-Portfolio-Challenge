    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2 id=&quot;rules-heading&quot;&gt;What the deployed strategy actually does&lt;/h2&gt;

    &lt;div class=&quot;rules-flow&quot; aria-label=&quot;F1 decision flow&quot;&gt;
      &lt;div class=&quot;flow-step&quot;&gt;
        &lt;strong&gt;1 · Book gate&lt;/strong&gt;
        &lt;span&gt;VIX &amp;lt; 35&lt;/span&gt;
        &lt;span&gt;7 days since rebalance order&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step&quot;&gt;
        &lt;strong&gt;2 · Qualify&lt;/strong&gt;
        &lt;span&gt;Price &amp;gt; SMA100&lt;/span&gt;
        &lt;span&gt;ROC63 &amp;gt; 0&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step&quot;&gt;
        &lt;strong&gt;3 · Rank and size&lt;/strong&gt;
        &lt;span&gt;Top eligible by ROC126&lt;/span&gt;
        &lt;span&gt;Weight by ROC63&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step&quot;&gt;
        &lt;strong&gt;4 · Own the call&lt;/strong&gt;
        &lt;span&gt;365–730 DTE&lt;/span&gt;
        &lt;span&gt;ATM to +100% OTM ladder&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step&quot;&gt;
        &lt;strong&gt;5 · Exit or recover&lt;/strong&gt;
        &lt;span&gt;Trend break · DTE180 · TP250&lt;/span&gt;
        &lt;span&gt;Recovery required to re-enter&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;table-responsive&quot;&gt;

        &lt;thead&gt;

            &lt;th&gt;Deployed F1&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;Entry&lt;/strong&gt;&lt;/td&gt;
            &lt;td class=&quot;old-rule&quot;&gt;All names proceed to ranking; top 19 by ROC252.&lt;/td&gt;
            &lt;td class=&quot;new-rule&quot;&gt;&lt;strong&gt;Only positive trends qualify:&lt;/strong&gt; price above SMA100 and ROC63 positive; rank eligible names by ROC126.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;Risk exit&lt;/strong&gt;&lt;/td&gt;
            &lt;td class=&quot;old-rule&quot;&gt;No loss or thesis exit. Hold unless TP250 or rotation intervenes.&lt;/td&gt;
            &lt;td class=&quot;new-rule&quot;&gt;&lt;strong&gt;Close the ticker&lt;/strong&gt; when price is below SMA100 &lt;em&gt;and&lt;/em&gt; ROC63 is negative.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;Time exit&lt;/strong&gt;&lt;/td&gt;
            &lt;td class=&quot;old-rule&quot;&gt;No DTE backstop.&lt;/td&gt;
            &lt;td class=&quot;new-rule&quot;&gt;&lt;strong&gt;Close at DTE ≤ 180&lt;/strong&gt; if the contract survives other exits.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;Winner and re-entry&lt;/strong&gt;&lt;/td&gt;
            &lt;td class=&quot;old-rule&quot;&gt;TP250 remains; no explicit recovery requirement.&lt;/td&gt;
