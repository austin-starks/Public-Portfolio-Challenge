name: Validate community run

on:
  pull_request:
    paths:
      - "community-runs/**"
      - "scripts/update_leaderboard.py"
      - "README.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_leaderboard.py --check
      - run: python3 -m unittest discover -s tests
